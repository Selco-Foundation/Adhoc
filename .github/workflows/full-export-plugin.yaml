name: Build Full Export Kibana Plugin Image

on:
  push:
    branches:
      - main
    paths:
      - plugins/full_export/*
  workflow_dispatch:

env:
  KIBANA_VERSION: "8.11.3"
  IMAGE_NAME: "selcohub/kibana-plugin-poc"

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.18.2
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Cache Kibana dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/yarn
          key: kibana-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            kibana-

      - name: Bootstrap Kibana
        run: yarn kbn bootstrap

      - name: Build Kibana plugin
        working-directory: plugins/full_export
        run: yarn build --kibana-version 8.11.3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./plugins
          file: ./plugins/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max